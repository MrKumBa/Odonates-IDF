<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Odonates d'Île-de-France</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3d5a2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#ece3cb;--card:#f8f2e0;--txt:#2a2a1c;--mut:#6b6648;--acc:#3d5a2a;--onacc:#f8f2e0;--ok:#4a7a2a;--ko:#a63d2a;--bd:#c9b88a}
@media(prefers-color-scheme:dark){:root{--bg:#1a1f14;--card:#242b1b;--txt:#ebe4cc;--mut:#a9a284;--acc:#a9c27a;--onacc:#1a1f14;--bd:#454b32}}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,"Palatino Linotype",serif;background:var(--bg) radial-gradient(circle at 20% 10%,#ffffff18,transparent 50%);color:var(--txt);line-height:1.45}
main{max-width:640px;margin:0 auto;padding:12px 14px 32px}
h1{font-size:1.4rem;margin:.6em 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.btn{display:block;width:100%;min-height:52px;padding:12px 14px;margin:8px 0;font:inherit;text-align:left;color:var(--txt);background:var(--card);border:2px solid var(--bd);border-radius:12px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--acc)}
.btn small{display:block;font-style:italic;color:var(--mut)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ko{background:var(--ko);border-color:var(--ko);color:#fff}
.btn.ok small,.btn.ko small{color:#fff}
.btn:disabled{cursor:default}
.primary{background:var(--acc);color:var(--onacc);border-color:var(--acc);text-align:center;font-weight:700}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin-bottom:8px}
.bar{height:6px;background:var(--bd);border-radius:3px;margin-bottom:10px}.bar i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .3s}
.photo{width:100%;aspect-ratio:4/3;background:#1118;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff;text-align:center}
.photo img{width:100%;height:100%;object-fit:contain}
#feedback{margin-top:10px}
#feedback h2{margin:.2em 0;font-size:1.1rem}
#feedback ul{padding-left:20px;margin:.4em 0}
.hidden{display:none}
.score{font-size:3rem;font-weight:800;text-align:center;color:var(--acc);margin:.2em 0}
.err{display:flex;gap:12px;margin:10px 0;padding:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px}
.err .photo{width:110px;aspect-ratio:1;flex:none;font-size:.7rem}
.err p{margin:.2em 0;font-size:.92rem}.err .bad{color:var(--ko)}.err .good{color:var(--ok)}
@media(min-width:700px){.photo{aspect-ratio:3/2}}
/* --- style naturaliste --- */
.card{box-shadow:0 2px 0 var(--bd)}
h1,h2,h3{font-variant:small-caps;letter-spacing:.03em;color:var(--acc)}
h3{font-size:1rem;margin:1em 0 .3em;border-bottom:1px solid var(--bd)}
.sub{color:var(--mut);font-style:italic;margin:-.4em 0 0}
.photo{background:#d9cca8;color:var(--mut);border:6px double var(--bd);border-radius:6px}
.btn.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--card));box-shadow:inset 4px 0 0 var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{min-width:56px;min-height:48px;font:inherit;font-weight:700;color:var(--txt);background:var(--card);border:2px solid var(--bd);border-radius:24px;cursor:pointer}
.chip.sel{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.quit{font:inherit;background:none;border:0;color:var(--mut);cursor:pointer;padding:6px 0}
#clues{margin-bottom:6px}#clues h3{margin-top:0}#clues ul{padding-left:20px;margin:.4em 0;font-size:1.05rem}
.hint{text-align:center;min-height:46px;border-style:dashed}
.btn.elim{opacity:.35;text-decoration:line-through}
details{margin-top:10px;font-size:.85rem;color:var(--mut)}
#imgList div{padding:2px 0;word-break:break-all}
</style>
</head>
<body>
<main>
  <section id="start" class="card">
    <h1>🌿 Carnet d'Odonates · Île-de-France</h1>
    <p class="sub"><span id="nbSp"></span> espèces de libellules et demoiselles</p>
    <h3>Mode de jeu</h3>
    <button class="btn mode sel" data-mode="classic">🔍 Reconnaissance visuelle<small>Identifie l'espèce d'après la photo</small></button>
    <button class="btn mode" data-mode="devinette">🧩 Devinette<small>Retrouve l'espèce d'après ses 2 critères de reconnaissance</small></button>
    <h3>Nombre de questions</h3>
    <div class="chips" id="chips"></div>
    <button class="btn primary" id="startBtn">Commencer</button>
    <details id="imgCheck"><summary>📁 Photos attendues (dossier images/)</summary><div id="imgList"></div></details>
  </section>

  <section id="quiz" class="hidden">
    <div class="top"><button class="quit" id="quitBtn">← Menu</button><span id="counter"></span><span id="score"></span></div>
    <div class="bar"><i id="progress"></i></div>
    <div class="photo" id="photo"></div>
    <div class="card hidden" id="clues"></div>
    <div id="answers"></div>
    <button class="btn hint" id="hintBtn">💡 Indice : éliminer 2 propositions (−50 % des points)</button>
    <div id="feedback" class="card hidden"></div>
    <button class="btn primary hidden" id="nextBtn">Suivant →</button>
  </section>

  <section id="results" class="hidden">
    <div class="card">
      <h1>Bilan</h1>
      <div class="score" id="finalScore"></div>
      <button class="btn primary" id="replayBtn">Rejouer (mêmes réglages)</button>
      <button class="btn" id="menuBtn">Changer de mode / de nombre de questions</button>
    </div>
    <h2 id="errTitle"></h2>
    <div id="errList"></div>
  </section>
</main>

<script>
/* =====================================================================

         avec ce nom dans le dossier "images". Pour une photo précise,
         tu peux aussi écrire ici un chemin ou une URL complète.

/* ===================== PARAMÈTRES ===================== */
const QUESTION_CHOICES = [10, 15, 20, 25, 30, 50, 60]; // choix proposés dans le menu

/* ===================== LOGIQUE DU JEU ===================== */
const $ = id => document.getElementById(id);
const shuffle = a => { a = [...a]; for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const label = s => `${s.fr} (${s.la})`;
const IMAGE_FOLDER = "images/";
const IMAGE_EXTS = ["jpg","jpeg","png","webp"];
const slug = sp => sp.la.toLowerCase().replace(/ /g, "-");
const imgCache = {};

// Renvoie (via une Promise) l'URL de la photo qui existe vraiment, ou null.
function getImage(sp){
  if (imgCache[sp.la]) return imgCache[sp.la];
  const list = sp.img ? [sp.img] : IMAGE_EXTS.map(e => IMAGE_FOLDER + slug(sp) + "." + e);
  imgCache[sp.la] = new Promise(res => {
    let i = 0;
    const tryNext = () => {
      if (i >= list.length) return res(null);
      const im = new Image();
      im.onload = () => res(list[i]);
      im.onerror = () => { i++; tryNext(); };
      im.src = list[i];
    };
    tryNext();
  });
  return imgCache[sp.la];
}

function setPhoto(sp){
  const box = $("photo");
  box.textContent = "Chargement…";
  getImage(sp).then(url=>{
    if(!url){ box.textContent = "Photo manquante. Ajoute : " + (sp.img || IMAGE_FOLDER + slug(sp) + ".jpg"); return; }
    const im = new Image();
    im.alt = "Photo à identifier";
    im.onload = () => { box.textContent=""; box.appendChild(im); };
    im.onerror = () => { box.textContent = "Photo non chargée : vérifie l'URL."; };
    im.src = url;
  });
}
function thumb(sp, el){ getImage(sp).then(u=>{ if(u){ const im=new Image(); im.src=u; im.alt=sp.fr; el.textContent=""; el.appendChild(im);} else el.textContent="Pas de photo"; }); }

let questions, idx, score, mistakes;
let mode = "classic";   // "classic" (photo) ou "devinette" (critères)
let count = 10;         // nombre de questions choisi
let hintUsed = false;
const fmt = n => n.toLocaleString("fr-FR");

function show(id){ ["start","quiz","results"].forEach(s=>$(s).classList.toggle("hidden", s!==id)); window.scrollTo(0,0); }

function startGame(){
  questions = shuffle(quizData).slice(0, count);
  idx = 0; score = 0; mistakes = [];
  show("quiz"); showQuestion();
}

function makeChoices(sp){
  const genus = sp.la.split(" ")[0];
  const others = shuffle(quizData.filter(s => s !== sp));
  const sameGenus = others.filter(s => s.la.split(" ")[0] === genus).slice(0,2); // pièges plausibles
  const rest = others.filter(s => !sameGenus.includes(s));
  return shuffle([sp, ...sameGenus, ...rest].slice(0, 4));
}

function showQuestion(){
  const sp = questions[idx];
  $("counter").textContent = `Question ${idx+1}/${questions.length}`;
  $("score").textContent = `Score : ${fmt(score)}`;
  $("progress").style.width = (idx/questions.length*100) + "%";
  $("feedback").classList.add("hidden");
  hintUsed = false; $("hintBtn").classList.remove("hidden");
  $("nextBtn").classList.add("hidden");
  const classic = mode === "classic";
  $("photo").classList.toggle("hidden", !classic);
  $("clues").classList.toggle("hidden", classic);
  if (classic) setPhoto(sp);
  else $("clues").innerHTML = `<h3>Quel est cet odonate ?</h3><ul>${sp.c.map(c=>`<li>${c}</li>`).join("")}</ul>`;
  const box = $("answers"); box.innerHTML = "";
  makeChoices(sp).forEach(opt=>{
    const b = document.createElement("button");
    b.className = "btn";
    b.innerHTML = `${opt.fr}<small>${opt.la}</small>`;
    b.onclick = () => answer(opt, b);
    b.dataset.la = opt.la;
    box.appendChild(b);
  });
  // précharge la photo suivante
  if (questions[idx+1]) getImage(questions[idx+1]).then(u=>{ if(u) new Image().src=u; });
}

function answer(chosen, btn){
  const sp = questions[idx];
  const good = chosen === sp;
  $("hintBtn").classList.add("hidden");
  document.querySelectorAll("#answers .btn").forEach(b=>{
    b.disabled = true;
    if (b.dataset.la === sp.la) b.classList.add("ok");
  });
  const pts = good ? (hintUsed ? 0.5 : 1) : 0;   // indice = −50 %
  score += pts;
  if (!good) { btn.classList.add("ko"); mistakes.push({sp, chosen}); }
  $("score").textContent = `Score : ${fmt(score)}`;
  const fb = $("feedback");
  fb.innerHTML = `<h2>${good ? "✅ Bonne réponse ! +" + fmt(pts) + " pt" : "❌ Raté"}</h2>
    <strong>${label(sp)}</strong>` +
    (mode === "classic" ? `<ul>${sp.c.map(c=>`<li>${c}</li>`).join("")}</ul>` : "");
  if (mode === "devinette") { $("photo").classList.remove("hidden"); setPhoto(sp); }
  fb.classList.remove("hidden");
  const nb = $("nextBtn");
  nb.textContent = idx+1 < questions.length ? "Suivant →" : "Voir le bilan";
  nb.classList.remove("hidden");
  nb.scrollIntoView({behavior:"smooth", block:"nearest"});
}

function next(){ idx++; idx < questions.length ? showQuestion() : showResults(); }

function showResults(){
  show("results");
  $("finalScore").textContent = `${fmt(score)} / ${questions.length}`;
  $("errTitle").textContent = mistakes.length ? "À revoir :" : "🎉 Sans faute !";
  const list = $("errList"); list.innerHTML = "";
  mistakes.forEach(({sp, chosen})=>{
    const d = document.createElement("div"); d.className = "err";
    d.innerHTML = `<div class="photo"></div><div>
      <p class="bad">Ta réponse : ${label(chosen)}</p>
      <p class="good"><strong>Réponse : ${label(sp)}</strong></p>
      <p>${sp.c.join(" · ")}</p></div>`;
    list.appendChild(d);
    thumb(sp, d.querySelector(".photo"));
  });
}

$("nbSp").textContent = quizData.length;
function select(sel, el){ document.querySelectorAll(sel).forEach(x => x.classList.toggle("sel", x === el)); }
QUESTION_CHOICES.forEach(n => {
  const b = document.createElement("button");
  b.className = "chip" + (n === count ? " sel" : "");
  b.textContent = n;
  b.onclick = () => { count = n; select(".chip", b); };
  $("chips").appendChild(b);
});
document.querySelectorAll(".mode").forEach(b => b.onclick = () => { mode = b.dataset.mode; select(".mode", b); });
$("quitBtn").onclick = () => show("start");
$("menuBtn").onclick = () => show("start");
$("startBtn").onclick = startGame;
$("nextBtn").onclick = next;
$("replayBtn").onclick = startGame;
$("hintBtn").onclick = () => {
  const sp = questions[idx]; hintUsed = true; $("hintBtn").classList.add("hidden");
  shuffle([...document.querySelectorAll("#answers .btn")].filter(b => b.dataset.la !== sp.la))
    .slice(0, 2).forEach(b => { b.disabled = true; b.classList.add("elim"); });
};
$("imgCheck").addEventListener("toggle", () => {
  const box = $("imgList"); if (box.dataset.done) return; box.dataset.done = 1;
  quizData.forEach(sp => {
    const d = document.createElement("div"), nm = sp.img || slug(sp) + ".jpg";
    d.textContent = "… " + nm; box.appendChild(d);
    getImage(sp).then(u => d.textContent = (u ? "✅ " : "❌ ") + nm + " — " + sp.fr);
  });
});
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js");
</script>
</body>
